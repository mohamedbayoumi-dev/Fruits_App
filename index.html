<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/all.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/media.css" />
  <title>Fruits Management App</title>

</head>

<body>

  <div class="app-shell">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-logo">
        <i class="fa-solid fa-apple-whole fa-xl"></i>
        Fruits App
      </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">

      <!-- Left Panel -->
      <div class="master-panel">
        <div class="master-header">
          <div class="master-title">
            Fruits
            <span id="fruitCount" class="fruit-count"></span>
          </div>

          <div class="search-wrap">
            <span class="search-icon">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="searchInput" placeholder="Search fruits..." />
            <button id="clearSearch" aria-label="Clear search">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div id="fruitList" class="fruit-list"></div>
      </div>

      <!-- Right Panel -->
      <div id="detailPanel" class="detail-panel"></div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
